name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: pnpm check
      - name: Validate project JSON
        shell: bash
        run: |
          for file in project/*.json; do jq -e . "$file" >/dev/null; done
      - name: Diff hygiene
        run: git diff --check
